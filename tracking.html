<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shipment Tracking</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .header {
      background: #102a43;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .header p {
      color: #d9e2ec;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .search-box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .search-box h2 {
      margin-bottom: 15px;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      border: 1px solid #ccd6dd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #1f7a8c;
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #155d6b;
    }

    .result {
      display: none;
      background: white;
      margin-top: 25px;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .status {
      display: inline-block;
      background: #e6f7ee;
      color: #18794e;
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: bold;
      margin: 15px 0;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 15px;
    }

    .card {
      background: #f4f7fb;
      padding: 15px;
      border-radius: 10px;
    }

    .card strong {
      display: block;
      color: #52606d;
      margin-bottom: 7px;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      color: #d64545;
    }

    .footer {
      text-align: center;
      padding: 30px;
      color: #627d98;
    }

    @media (max-width: 600px) {
      .search-row {
        flex-direction: column;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>📦 Shipment Tracking</h1>
    <p>Track your shipment quickly and easily</p>
  </div>

  <div class="container">

    <div class="search-box">
      <h2>Track Your Shipment</h2>

      <div class="search-row">
        <input
          type="text"
          id="trackingInput"
          placeholder="Enter your tracking number"
        >

        <button onclick="trackShipment()">
          Track Shipment
        </button>
      </div>

      <div class="message" id="message"></div>
    </div>

    <div class="result" id="result">

      <h2>Shipment Details</h2>

      <div class="status" id="status">
        In Transit
      </div>

      <div class="details">

        <div class="card">
          <strong>Tracking Number</strong>
          <span id="trackingNumber"></span>
        </div>

        <div class="card">
          <strong>Current Status</strong>
          <span id="shipmentStatus"></span>
        </div>

        <div class="card">
          <strong>Origin</strong>
          <span id="origin"></span>
        </div>

        <div class="card">
          <strong>Destination</strong>
          <span id="destination"></span>
        </div>

        <div class="card">
          <strong>Service</strong>
          <span id="service"></span>
        </div>

        <div class="card">
          <strong>Estimated Delivery</strong>
          <span id="delivery"></span>
        </div>

      </div>

    </div>

  </div>

  <div class="footer">
    © 2026 Shipment Tracking
  </div>


  <script>

    function trackShipment() {

      const input = document
        .getElementById("trackingInput")
        .value
        .trim();

      const result = document.getElementById("result");

      const message = document.getElementById("message");

      message.innerHTML = "";

      if (input === "") {
        result.style.display = "none";
        message.innerHTML = "Please enter a tracking number.";
        return;
      }

      document.getElementById("trackingNumber").innerHTML = input;

      document.getElementById("shipmentStatus").innerHTML =
        "In Transit";

      document.getElementById("status").innerHTML =
        "🚚 In Transit";

      document.getElementById("origin").innerHTML =
        "Shipment Origin";

      document.getElementById("destination").innerHTML =
        "Shipment Destination";

      document.getElementById("service").innerHTML =
        "Standard Delivery";

      document.getElementById("delivery").innerHTML =
        "Estimated delivery information coming soon";

      result.style.display = "block";

    }

  </script>

</body>
</html>
