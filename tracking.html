<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shipment Tracking</title>

  <!-- Supabase JavaScript Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #172033;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h2 {
      text-align: center;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
    }

    .shipment-info {
      background: #f8fafc;
      padding: 20px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .event {
      border-left: 4px solid #2563eb;
      padding: 10px 15px;
      margin: 12px 0;
      background: #f8fafc;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Shipment Tracking</h1>
  </header>

  <div class="container">

    <div class="card">

      <h2>Track Your Shipment</h2>

      <div class="search-box">

        <input
          type="text"
          id="trackingNumber"
          placeholder="Enter your tracking number"
        >

        <button onclick="trackShipment()">
          Track
        </button>

      </div>

      <div id="result"></div>

    </div>

  </div>


  <script>

    // Supabase connection
    const SUPABASE_URL = "https://dgwncijvafhbsgakmiqo.supabase.co";

    const SUPABASE_KEY = "sb_publishable_dyltRd6ccwZ9CvNVpwjCXw_GbmBkpiB";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // Track shipment
    async function trackShipment() {

      const trackingNumber = document
        .getElementById("trackingNumber")
        .value
        .trim();

      const result = document.getElementById("result");

      // Clear previous result
      result.innerHTML = "";


      // Check if tracking number was entered
      if (!trackingNumber) {

        result.innerHTML =
          '<p class="error">Please enter a tracking number.</p>';

        return;
      }


      // Show searching message
      result.innerHTML =
        "<p>Searching for your shipment...</p>";


      try {

        // Search for shipment
        const { data: shipment, error } =
          await supabaseClient
            .from("shipments")
            .select("*")
            .eq("tracking_number", trackingNumber)
            .single();


        // Shipment not found
        if (error || !shipment) {

          result.innerHTML =
            '<p class="error">Shipment not found.</p>';

          return;
        }


        // Display shipment information
        let html = `

          <div class="shipment-info">

            <h3>Shipment Found</h3>

            <p>
              <strong>Tracking Number:</strong>
              ${shipment.tracking_number || "N/A"}
            </p>

            <p>
              <strong>Origin:</strong>
              ${shipment.origin || "N/A"}
            </p>

            <p>
              <strong>Destination:</strong>
              ${shipment.destination || "N/A"}
            </p>

            <p>
              <strong>Service:</strong>
              ${shipment.service || "N/A"}
            </p>

            <p>
              <strong>Status:</strong>
              ${shipment.status || "N/A"}
            </p>

            <p>
              <strong>Estimated Delivery:</strong>
              ${shipment.estimated_delivery || "N/A"}
            </p>

          </div>

        `;


        result.innerHTML = html;

      } catch (err) {

        console.error(err);

        result.innerHTML =
          '<p class="error">Something went wrong. Please try again.</p>';

      }

    }


    // Allow Enter key to search
    document
      .getElementById("trackingNumber")
      .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {
          trackShipment();
        }

      });

  </script>

</body>
</html>
