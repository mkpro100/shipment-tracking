<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipment Tracking</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .header {
      background: #102a43;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      opacity: 0.85;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccd6e0;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 8px;
      background: #1677ff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }

    .result {
      margin-top: 25px;
      border-top: 1px solid #e2e8f0;
      padding-top: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 0;
      border-bottom: 1px solid #edf1f5;
    }

    .row strong {
      color: #52606d;
    }

    .status {
      font-weight: bold;
      color: #1677ff;
    }

    .hidden {
      display: none;
    }

    .footer {
      text-align: center;
      padding: 25px;
      color: #697586;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Shipment Tracking</h1>
    <p>Enter your tracking number to check your shipment</p>
  </div>

  <div class="container">
    <div class="card">

      <label for="trackingInput">Tracking Number</label>

      <input
        id="trackingInput"
        type="text"
        placeholder="Example: TRK-C783202A3A00"
        autocomplete="off"
      >

      <button id="trackButton" onclick="trackShipment()">
        Track Shipment
      </button>

      <div id="message"></div>

      <div id="result" class="result hidden">

        <div class="row">
          <strong>Tracking Number</strong>
          <span id="trackingNumber"></span>
        </div>

        <div class="row">
          <strong>Origin</strong>
          <span id="origin"></span>
        </div>

        <div class="row">
          <strong>Destination</strong>
          <span id="destination"></span>
        </div>

        <div class="row">
          <strong>Service</strong>
          <span id="service"></span>
        </div>

        <div class="row">
          <strong>Status</strong>
          <span id="status" class="status"></span>
        </div>

        <div class="row">
          <strong>Estimated Delivery</strong>
          <span id="estimatedDelivery"></span>
        </div>

      </div>

    </div>
  </div>

  <div class="footer">
    Shipment Tracking System
  </div>


  <script>
    sb_publishable_dyltRd6ccwZ9CvNVpwjCXw_GbmBkpiB

    const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";


    async function trackShipment() {

      const input = document
        .getElementById("trackingInput")
        .value
        .trim();

      const message = document.getElementById("message");
      const result = document.getElementById("result");
      const button = document.getElementById("trackButton");

      result.classList.add("hidden");

      if (!input) {
        message.textContent = "Please enter a tracking number.";
        return;
      }

      message.textContent = "Searching for shipment...";
      button.disabled = true;

      try {

        const response = await fetch(
          SUPABASE_URL +
          "/rest/v1/shipments?or=(tracking_code.eq." +
          encodeURIComponent(input) +
          ",tracking_number.eq." +
          encodeURIComponent(input) +
          ")&select=tracking_code,tracking_number,origin,destination,service,status,estimated_delivery",
          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY
            }
          }
        );

        if (!response.ok) {
          throw new Error("Unable to contact the shipment database.");
        }

        const shipments = await response.json();

        if (shipments.length === 0) {
          message.textContent = "Shipment not found. Please check your tracking number.";
          return;
        }

        const shipment = shipments[0];

        document.getElementById("trackingNumber").textContent =
          shipment.tracking_code || shipment.tracking_number || "";

        document.getElementById("origin").textContent =
          shipment.origin || "";

        document.getElementById("destination").textContent =
          shipment.destination || "";

        document.getElementById("service").textContent =
          shipment.service || "";

        document.getElementById("status").textContent =
          shipment.status || "";

        document.getElementById("estimatedDelivery").textContent =
          shipment.estimated_delivery || "";

        message.textContent = "";
        result.classList.remove("hidden");

      } catch (error) {

        message.textContent = error.message;

      } finally {

        button.disabled = false;

      }
    }
  </script>

</body>
</html>
